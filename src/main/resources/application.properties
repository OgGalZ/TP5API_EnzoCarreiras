spring.application.name=tp-securite-api

# HTTPS (exercice 5)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${KEYSTORE_PASSWORD:tpsecurite}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tpapi
# port http qui redirige vers https (false = le http est refuse)
app.https.redirect-http=true
app.https.http-port=8080

server.error.include-stacktrace=never
server.error.include-message=never

# secrets, a passer en variables d'environnement en vrai
app.security.api-key=${API_KEY:123456abcdef}
app.security.jwt.secret=${JWT_SECRET:mySecretKeyMySecretKeyMySecretKey123!}
app.security.jwt.expiration-ms=3600000

# rate limiting (exercice 4) : impl = maison ou bucket4j
app.security.rate-limit.impl=bucket4j
app.security.rate-limit.max-requests=5
app.security.rate-limit.window-ms=60000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

# base H2 en memoire
spring.datasource.url=jdbc:h2:mem:tpdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.user-password=${USER_PASSWORD:user123}

# swagger
springdoc.swagger-ui.path=/swagger-ui.html
